<!doctype html>
<html lang="pt-BR">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>SyntaxWear - Ecommerce</title>

    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/variables.css">
    <link rel="stylesheet" href="./css/base.css">
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/componentes/header.css">
    <link rel="stylesheet" href="./css/componentes/panel.css">
    <link rel="stylesheet" href="./css/componentes/hero.css">
    <link rel="stylesheet" href="./css/componentes/product-card.css">
    <link rel="stylesheet" href="./css/componentes/product-grid.css">
    <link rel="stylesheet" href="./css/componentes/footer.css">
    <link rel="stylesheet" href="./css/componentes/newsletter.css">

</head>

<body>

    <h1>titulo</h1>

    <header class="site-header">
        <div class="container header-inner">
            <a href="/" class="logo" aria-label="SyntaxWear logo"></a>
            <nav class="main-nav" aria-label="Navegação principal">
                <ul class="nav-list">
                    <li><a href="#categorias">Categorias</a></li>
                    <li><a href="#destaques">Destaques</a></li>
                    <li><a href="#contato">Contato</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <section id="hero" class="hero" aria-label="Seção principal - Hero">
            <!-- Estrutura macro: conteúdo do Hero será adicionado depois -->
        </section>

        <section id="categorias" class="categorias" aria-label="Seção de categorias de tênis">
            <!-- Estrutura macro: lista de categorias -->
        </section>

        <section id="destaques" class="produtos-destaque" aria-label="Grid com produtos em destaque">
            <!-- Estrutura macro: grid de produtos -->
        </section>
    </main>

    <footer id="contato" class="site-footer" aria-label="Rodapé - informações de contato e links">
        <div class="container footer-inner">
            <!-- Estrutura macro: informações de contato e links -->
        </div>
    </footer>

</body>

</html>
